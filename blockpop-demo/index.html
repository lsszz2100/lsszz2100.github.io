<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F7FF">
<title>Block Pop: 8x8 Puzzle</title>
<style>
  @font-face{font-family:'BlockPop';src:url('fonts/NotoSansKR-Regular.ttf') format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'BlockPop';src:url('fonts/NotoSansKR-Bold.ttf') format('truetype');font-weight:700;font-display:block}
  @font-face{font-family:'BlockPop';src:url('fonts/NotoSansKR-Black.ttf') format('truetype');font-weight:900;font-display:block}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#EAF2FF;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;font-family:'BlockPop',system-ui,sans-serif}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<script src="game.js"></script>
</body>
</html>
