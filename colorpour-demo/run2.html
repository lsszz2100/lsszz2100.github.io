<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1F">
<title>Color Pour: 볼 정렬 퍼즐</title>
<style>
  @font-face{font-family:'NotoSansKR';src:url('fonts/NotoSansKR-Regular.ttf') format('truetype');font-weight:400;font-display:block}
  @font-face{font-family:'NotoSansKR';src:url('fonts/NotoSansKR-Bold.ttf') format('truetype');font-weight:700;font-display:block}
  @font-face{font-family:'NotoSansKR';src:url('fonts/NotoSansKR-Black.ttf') format('truetype');font-weight:900;font-display:block}
  html,body{margin:0;padding:0;height:100%;background:#08071a;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:none}
  #stage{position:relative;line-height:0}
  canvas{display:block;border-radius:0}
  #debug{position:fixed;left:8px;top:8px;z-index:9;display:none;flex-wrap:wrap;gap:6px;max-width:60vw}
  #debug button{font:12px/1.4 system-ui,sans-serif;padding:6px 8px;border-radius:8px;border:1px solid #fff4;background:#1b1038cc;color:#fff}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1080" height="1920"></canvas></div>
<div id="debug"></div>
<script src="levels.js?v=3"></script>
<script src="game.js?v=3"></script>
</body>
</html>
